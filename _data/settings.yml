#-------------------------------
# FAQ Section
#-------------------------------
faq:
  enable: true
  title: Questions? <em>Answers</em>.
  description: Find solutions to common queries here.

faq_items:
  - title: What are your main areas of expertise?
    description: My specialization includes software development, open source contributions, and building developer tools. I'm passionate about clean code, performance optimization, and creating intuitive user experiences.
  - title: Can you provide examples of your work?
    description: Yes, on my website you can find a portfolio with examples of my projects, documentation for various tools I've created, and blog posts about software development best practices.
  - title: What is your experience with various platforms?
    description: I have extensive experience working with various platforms, including web applications, command-line tools, and desktop applications. I'm comfortable with Linux environments and containerized deployments.
  - title: What tools and software do you use?
    description: I work with tools such as Jekyll for static sites, Git for version control, Docker for containerization, and various programming languages including JavaScript, Python, and Rust.
  - title: How long does it take to complete a project?
    description: The development time depends on the complexity of the project. Usually, creating a fully functional tool or application takes from several weeks to several months, depending on scope and requirements.
  - title: How can I contact you?
    description: You can contact me through the contact form on my website or directly via email. I'm always open to new projects and ready to discuss your ideas or potential collaborations.

