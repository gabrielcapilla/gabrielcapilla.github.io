---
layout: default
capabilities:
    - copy
    - smooth-scroll
---

<div class="hub-container">
    <header class="page-header">
        {% if page.back_link %} {% include components/back-link.html url="/"
        text="Back to Hub" %} {% endif %}

        <h1 class="page-title">{{ page.title }}</h1>

        {% if page.description %}
        <p class="page-description">{{ page.description }}</p>
        {% endif %}
    </header>

    {{ content }}
</div>
