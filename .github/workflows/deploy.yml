name: Build and Deploy Jekyll Site

on:
  # Run workflow on pushes to main branch
  push:
    branches:
      - main
      - master

  # Run workflow on pull requests to main
  pull_request:
    branches:
      - main
      - master

  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Ruby
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true # Automatically installs gems, uses cache
          cache-version: 0

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate source policy
        run: npm run validate:source

      - name: Check client JavaScript
        run: node --check assets/js/main.js

      # 4. Build Jekyll site
      - name: Build Jekyll site
        run: npm run build:site
        env:
          JEKYLL_ENV: production

      # 5. Upload build artifacts
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Optional: Test and Validation job
  test:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install html-proofer
        run: |
          gem install html-proofer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Test links and files
        run: |
          npm ci
          npm run validate:source
          npm run build:site
          htmlproofer ./_site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/" \
            --allow-hash-href \
            --empty-alt-ignore

      - name: Check for broken internal links
        run: |
          find _site -name "*.html" -exec grep -l 'href="#"' {} \;

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Lighthouse budgets
        run: |
          npm run serve:site &
          for attempt in {1..30}; do
            if node -e "fetch('http://127.0.0.1:4010/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              break
            fi
            sleep 1
          done
          CHROME_PATH="${{ steps.setup-chrome.outputs.chrome-path }}" npm run benchmark:lighthouse
