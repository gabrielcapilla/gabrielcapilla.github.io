<!-- Accessible, Lazy-Loaded Image Component -->
<!-- Usage: {% include components/image.html src="/path/to/image.jpg" alt="Description" width="800" height="600" class="your-class" %} -->
<!-- Note: Always provide width and height to prevent layout shift -->

<img
    src="{{ include.src | relative_url }}"
    alt="{{ include.alt | default: '' }}"
    {%
    if
    include.width
    %}width="{{ include.width }}"
    {%
    endif
    %}
    {%
    if
    include.height
    %}height="{{ include.height }}"
    {%
    endif
    %}
    {%
    if
    include.class
    %}class="{{ include.class }} lazy-load"
    {%
    else
    %}class="lazy-load"
    {%
    endif
    %}
    loading="lazy"
    decoding="async"
    {%
    if
    include.fetchpriority
    %}fetchpriority="{{ include.fetchpriority }}"
    {%
    endif
    %}
/>
