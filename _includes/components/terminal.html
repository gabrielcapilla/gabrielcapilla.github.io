<div class="terminal-wrapper">
    <div class="terminal">
        <div class="terminal-header">
            <div class="window-controls">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="terminal-title">dotman — bash</div>
            <div class="terminal-header-spacer"></div>
        </div>
        <div class="terminal-body">
            <div class="cmd-line">
                <div class="cmd-prompt">
                    <span class="prompt-arrow">➜</span>
                    <span class="prompt-tilde">~</span>
                    <span>dotman init</span>
                </div>
                <div class="cmd-output">
                    Initialized at
                    <span class="terminal-path">~/.dotfiles</span>
                </div>
            </div>

            <div class="cmd-line">
                <div class="cmd-prompt">
                    <span class="prompt-arrow">➜</span>
                    <span class="prompt-tilde">~</span>
                    <span>dotman set ~/.config/nvim</span>
                </div>
                <div class="cmd-output">
                    Set: ~/.config/nvim →
                    <span class="terminal-path">~/.dotfiles/main/config/nvim</span>
                </div>
            </div>

            <div class="cmd-line">
                <div class="cmd-prompt">
                    <span class="prompt-arrow">➜</span>
                    <span class="prompt-tilde">~</span>
                    <span>dotman add fish</span>
                </div>
                <div class="cmd-output">
                    <span class="terminal-muted">Validating links...</span><br />
                    Creating symlinks...
                    <span class="terminal-success">Done</span>
                </div>
            </div>

            <div class="cmd-line">
                <div class="cmd-prompt">
                    <span class="prompt-arrow">➜</span>
                    <span class="prompt-tilde">~</span>
                    <span class="cursor"></span>
                </div>
            </div>
        </div>
    </div>
</div>
